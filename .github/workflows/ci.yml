name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t usagebar-sync-server .
      - run: |
          docker run -d --name sync -p 8787:8787 usagebar-sync-server
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/v1/info && break; sleep 1; done
          scripts/smoke.sh http://127.0.0.1:8787
